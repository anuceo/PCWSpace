[workspace]
members = [
    "crates/core",
    "crates/deltashots",
    "crates/infra",
    "crates/agents",
    "crates/artifacts",
    "crates/workflows",
    "crates/runtime",
    "crates/intelligence",
    "crates/storm",
    "crates/audit",
    "crates/timeline",
    "crates/api",
]
resolver = "2"

[workspace.package]
version     = "0.1.0"
edition     = "2021"
authors     = ["one-man-ai-os"]
license     = "MIT"

[workspace.dependencies]
# Async runtime
tokio       = { version = "1", features = ["full"] }
# Web framework
axum        = { version = "0.7", features = ["json", "macros"] }
tower       = "0.4"
tower-http  = { version = "0.5", features = ["cors", "request-id", "trace"] }
# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
# Redis
redis       = { version = "0.27", features = ["tokio-comp", "streams", "connection-manager"] }
# HTTP client
reqwest     = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# Crypto — pure Rust, no OpenSSL
aes-gcm     = "0.10"
hmac        = "0.12"
sha2        = "0.10"
hkdf        = "0.12"
rand        = "0.8"
hex         = "0.4"
# Error handling
thiserror   = "1"
anyhow      = "1"
# Logging / tracing
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "json"] }
# UUID
uuid        = { version = "1", features = ["v4", "serde"] }
# Time
chrono      = { version = "0.4", features = ["serde"] }
# Env
dotenvy     = "0.15"
# Config
config      = "0.14"
# Async traits
async-trait = "0.1"

[profile.release]
opt-level   = 3
lto         = "thin"
codegen-units = 1
